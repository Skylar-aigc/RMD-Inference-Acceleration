name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pydantic PyYAML ruff pytest
      - name: Lint
        run: ruff check src tests app.py benchmarks
      - name: Format
        run: ruff format --check src tests app.py benchmarks
      - name: Unit tests
        run: pytest -q
