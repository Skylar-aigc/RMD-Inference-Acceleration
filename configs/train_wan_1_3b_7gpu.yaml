# Wan2.1-T2V-1.3B recipe for seven GPUs with FSDP.
# Replace this path with the Diffusers-format Wan 1.3B directory on the server.
pretrained_model_name_or_path: /data/models/Wan2.1-T2V-1.3B-Diffusers
device: auto
train_batch_size: 1
gradient_accumulation_steps: 4
max_train_steps: 300
checkpointing_steps: 50
learning_rate: 5e-6
learning_rate_fake: 2e-5
lr_scheduler: cosine_with_restarts
lr_warmup_steps: 5
lr_num_cycles: 1
adam_beta1: 0.0
adam_beta2: 0.95
# Keep standard AdamW for FSDP compatibility. AdamW8bit remains an explicit
# opt-in, but upstream bitsandbytes does not guarantee FSDP optimizer support.
use_8bit_adam: false
k_step: 6
cfg: 5.0
eta: 0.0
flow_shift: 3.0
multistage_upsample: true
flow_shift_trans: 1
low_rs_step: 3
# Sample the full interval without a scaled timestep offset.
timestep_offset_mode: zero
t_offset_factor: 0.5
split_timestep: false
warmup_step: 15
gradient_checkpointing: true
mixed_precision: bf16
output_dir: outputs/rmd-1.3b-local-7gpu
data_path: examples/vidprom_prompts_2000.txt
prompt_embed_batch_size: 8
# Sigma weighting used by the Phase 1 distribution-matching objective.
score_weighting_mode: inverse_sigma
validation_prompt_path: examples/sample_prompts.txt
validation_num_prompts: 10
validation_at_step_one: true
